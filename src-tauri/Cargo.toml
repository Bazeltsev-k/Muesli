[package]
name = "muesli"
version = "0.1.0"
description = "Local-first meeting recorder and transcriber"
authors = ["Kirill Bazeltsev"]
edition = "2024"
license = "MIT"

[lib]
name = "muesli_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
futures-util = "0.3.34"
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
